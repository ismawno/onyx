# Builds Onyx on every supported toolchain and runs the onyx-tests suite on each of them.
#
# GitHub hosted runners have no GPU: Vulkan runs on Mesa's lavapipe (a CPU driver) on Linux and Windows, under a
# virtual display (Xvfb) on Linux. macOS runs on MoltenVK, which needs a Metal device the hosted runners may not
# expose: its tests do not fail the job until that is known to work (see the macOS step).
#
# Debug builds enable the Vulkan validation layers and panic on any validation error, so a validation error fails the
# test that caused it. The layers come from the LunarG SDK, pinned below: they must be at least as new as the Vulkan
# headers Onyx builds with, or they reject structures they do not know yet.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # nightly: graphite, toolkit and vulkit are fetched at main, so they can break Onyx without a commit here
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_SDK_VERSION: 1.4.328.1

jobs:
  onyx:
    name: ${{ matrix.config.name }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # pull requests build debug only, the rest (main, tags, nightly, manual runs) both presets
        preset: ${{ fromJSON(github.event_name == 'pull_request' && '["debug"]' || '["debug", "release"]') }}
        config:
          - { name: linux-gcc, os: ubuntu-26.04, cc: gcc, cxx: g++ }
          - {
              name: linux-clang,
              os: ubuntu-26.04,
              cc: clang,
              cxx: clang++,
              lld: true,
            }
          - { name: windows-msvc, os: windows-2025-vs2026, cc: cl, cxx: cl }
          # the GNU style clang++ driver, not clang-cl: toolkit picks its flags by compiler id and by MSVC, and
          # clang-cl would get both kinds. lld links LTO (release) objects, which link.exe cannot read
          - {
              name: windows-clang,
              os: windows-2025-vs2026,
              cc: clang,
              cxx: clang++,
              lld: true,
            }
          - { name: macos-clang, os: macos-26, cc: clang, cxx: clang++ }

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------------------------------------------------
      #  Toolchains and dependencies
      # ---------------------------------------------------------------------------------------------------------------

      # toolkit's reflection and serialization code generators run Python 3 at build time. CMake finds it on its own,
      # but runner images ship several interpreters: this pins the same one on every job
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config lld \
            xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libdbus-1-dev libfontconfig-dev libfreetype-dev \
            xvfb xauth mesa-vulkan-drivers pulseaudio pulseaudio-utils

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }

      # the SDK brings the validation layers (and the loader and MoltenVK on macOS). on Windows the action also
      # installs lavapipe and registers it as a Vulkan driver
      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          install_lavapipe: ${{ runner.os == 'Windows' }}
          cache: true

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ---------------------------------------------------------------------------------------------------------------
      #  Build
      # ---------------------------------------------------------------------------------------------------------------

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.config.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }}
          ${{ matrix.config.lld && '-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld' || '' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # ---------------------------------------------------------------------------------------------------------------
      #  Runtime tests. Each test runs in a process of its own and opens small windows. The runner writes a JUnit report,
      #  adds a summary to the job page and annotates failures in the diff
      # ---------------------------------------------------------------------------------------------------------------

      - name: Tests (Linux, Xvfb + lavapipe)
        if: runner.os == 'Linux'
        working-directory: build/${{ matrix.preset }}
        run: |
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          # a null sink gives miniaudio a real backend, so the audio tests run instead of skipping
          pulseaudio --start --exit-idle-time=-1 && pactl load-module module-null-sink sink_name=ci \
            || echo "no PulseAudio: the audio tests will skip"
          xvfb-run -a -s "-screen 0 1920x1080x24" ./tests/onyx-tests --jobs 4 --timeout-scale 2 \
            --label "${{ matrix.config.name }} ${{ matrix.preset }}" --junit onyx-tests.xml

      - name: Tests (Windows, lavapipe)
        if: runner.os == 'Windows'
        working-directory: build/${{ matrix.preset }}
        run: |
          $env:VK_DRIVER_FILES = "C:\lavapipe\share\vulkan\icd.d\lvp_icd.x86_64.json"
          $env:VK_LAYER_PATH = "$env:VULKAN_SDK\Bin"
          ./tests/onyx-tests.exe --jobs 4 --timeout-scale 2 --label "${{ matrix.config.name }} ${{ matrix.preset }}" --junit onyx-tests.xml

      # MoltenVK needs Metal. If the hosted runner exposes no Metal device, every test crashes at Initialize: the step is
      # allowed to fail until a run shows it works. Then remove continue-on-error, or move the tests to a self hosted Mac
      # (see the end of this file)
      - name: Tests (macOS, MoltenVK)
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: build/${{ matrix.preset }}
        run: |
          export VK_DRIVER_FILES="$VULKAN_SDK/share/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LAYER_PATH="$VULKAN_SDK/share/vulkan/explicit_layer.d"
          "$VULKAN_SDK/bin/vulkaninfo" --summary || true
          ./tests/onyx-tests --jobs 4 --timeout-scale 2 \
            --label "${{ matrix.config.name }} ${{ matrix.preset }}" --junit onyx-tests.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onyx-tests-${{ matrix.config.name }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/onyx-tests.xml
          if-no-files-found: ignore

  # a single check to require in branch protection (Settings > Branches): it is green only when every configuration is
  ci-ok:
    name: CI ok
    if: always()
    needs: onyx
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.onyx.result }}" = "success"

  # If the hosted macOS runners cannot run Vulkan, register a Mac of yours as a self hosted runner (Settings > Actions >
  # Runners) with the labels below and enable this job. Only for pushes and manual runs: a pull request from a fork
  # would otherwise run its code on your machine.
  #
  # macos-gpu:
  #   if: github.event_name != 'pull_request'
  #   runs-on: [self-hosted, macOS, ARM64]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: cmake --preset debug -G Ninja && cmake --build --preset debug
  #     - working-directory: build/debug
  #       run: ./tests/onyx-tests --jobs 4 --junit onyx-tests.xml
